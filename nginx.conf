server {
    listen 80;
    server_name www.mertsengun.com;
    return 301 https://mertsengun.com$request_uri;
}

server {
    listen 80 default_server;
    server_name mertsengun.com _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
